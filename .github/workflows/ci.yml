name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hr
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Overrides the values in application.properties for CI only
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/hr
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create database schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < db/schema.sql

      - name: Build and run unit tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Start application
        run: |
          nohup java -jar target/hr-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:8989/api/employees > /dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 2
          done
          echo "App failed to start"; cat app.log; exit 1

      - name: Run Postman collection (API tests)
        run: npx --yes newman run postman/hr-employees.postman_collection.json

      - name: Show app log on failure
        if: failure()
        run: cat app.log || true
